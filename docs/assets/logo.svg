<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#222736" stop-opacity="0.96" />
      <stop offset="60%" stop-color="#141722" stop-opacity="0.97" />
      <stop offset="100%" stop-color="#0b0d14" stop-opacity="0.99" />
    </radialGradient>

    <!-- Outer Rainbow Dynamic Ring Gradient -->
    <linearGradient id="rainbowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="25%" stop-color="#5468ff" />
      <stop offset="50%" stop-color="#b854ff" />
      <stop offset="75%" stop-color="#ff54a8" />
      <stop offset="100%" stop-color="#00e5c0" />
    </linearGradient>

    <!-- Inner Subtle White Highlight Stroke -->
    <linearGradient id="innerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Sparkles Gradient -->
    <linearGradient id="sparklesGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Beacon Radial Gradient -->
    <radialGradient id="beaconGradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>

    <!-- Pill Border Gradient -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>

    <!-- Soft Outer Glow Filter -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Beacon Glow Filter -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sparkles Glow Filter -->
    <filter id="sparklesGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.22   0 0 0 0 0.74   0 0 0 0 0.97   0 0 0 0.85 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pill Shadow -->
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- 1. Ambient Outer Halo -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#rainbowBorder)" stroke-width="12" opacity="0.85" filter="url(#outerGlow)" />

  <!-- 2. Frosted Obsidian Glass Body -->
  <circle cx="256" cy="256" r="192" fill="url(#bgGradient)" stroke="url(#innerStroke)" stroke-width="2.5" />

  <!-- 3. Rainbow Perimeter Ring Rim -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#rainbowBorder)" stroke-width="5.5" />

  <!-- 4. Central Sparkles Icon -->
  <g filter="url(#sparklesGlow)" transform="translate(256, 222)">
    <!-- Primary Major Sparkle -->
    <path d="M 0 -58 C 0 -18, 18 0, 58 0 C 18 0, 0 18, 0 58 C 0 18, -18 0, -58 0 C -18 0, 0 -18, 0 -58 Z"
          fill="url(#sparklesGradient)" />
    <!-- Secondary Top-Left Sparkle -->
    <path d="M -36 -46 C -36 -32, -26 -22, -12 -22 C -26 -22, -36 -12, -36 2 C -36 -12, -46 -22, -60 -22 C -46 -22, -36 -32, -36 -46 Z"
          fill="url(#sparklesGradient)" opacity="0.95" />
    <!-- Tertiary Mini Sparkle -->
    <path d="M 12 -62 C 12 -53, 19 -46, 28 -46 C 19 -46, 12 -39, 12 -30 C 12 -39, 5 -46, -4 -46 C 5 -46, 12 -53, 12 -62 Z"
          fill="url(#sparklesGradient)" opacity="0.9" />
  </g>

  <!-- 5. Bottom Capsule / Pill Badge ("FlowPilot") -->
  <g filter="url(#pillShadow)" transform="translate(256, 350)">
    <!-- Pill Background Container -->
    <rect x="-142" y="-28" width="284" height="56" rx="28"
          fill="#090b10" fill-opacity="0.92"
          stroke="url(#pillBorder)" stroke-width="2.2" />

    <!-- Green Lightning Bolt Icon -->
    <path d="M -108 -13 L -120 4 L -110 4 L -113 16 L -98 -1 L -107 -1 Z"
          fill="#10b981" />

    <!-- "FlowPilot" Brand Typography -->
    <text x="-90" y="9"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="29"
          font-weight="800"
          letter-spacing="0.4"
          fill="#ffffff">FlowPilot</text>
  </g>

  <!-- 6. Emerald Active Beacon (Top Right) -->
  <g transform="translate(394, 118)">
    <!-- Ambient Beacon Bloom -->
    <circle cx="0" cy="0" r="32" fill="#10b981" opacity="0.35" filter="url(#beaconGlow)" />
    <!-- Solid Beacon Rim & Center -->
    <circle cx="0" cy="0" r="23" fill="url(#beaconGradient)" stroke="#090b10" stroke-width="4.5" />
    <!-- Inner Highlight -->
    <circle cx="-5" cy="-5" r="7" fill="#ffffff" opacity="0.4" />
  </g>
</svg>
