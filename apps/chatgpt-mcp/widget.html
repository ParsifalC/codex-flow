<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlowPilot telemetry</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f6f7f9;
        --surface: #ffffff;
        --surface-muted: #eef1f5;
        --border: #d7dce3;
        --text: #1f2329;
        --muted: #5d6673;
        --accent: #1458d4;
        --accent-contrast: #ffffff;
        --success: #1c7c54;
        --danger: #b42318;
        --focus: #0b63ce;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #16181d;
          --surface: #22252b;
          --surface-muted: #2d323a;
          --border: #444b57;
          --text: #f3f5f7;
          --muted: #b4bcc8;
          --accent: #8ab4ff;
          --accent-contrast: #121722;
          --success: #72d6a7;
          --danger: #ff9b91;
          --focus: #9bc2ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }

      .widget {
        width: min(100%, 430px);
        margin: 0 auto;
        padding: 12px;
      }

      body[data-display-mode="fullscreen"] .widget {
        width: min(100%, 760px);
        padding: 24px;
      }

      .shell {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 4px 18px rgb(16 24 40 / 8%);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px 10px;
      }

      .eyebrow,
      .mode {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 650;
      }

      .signal {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--muted);
      }

      .signal[data-state="ready"] {
        background: var(--success);
      }

      .signal[data-state="loading"] {
        background: var(--accent);
        animation: pulse 1.1s ease-in-out infinite;
      }

      .signal[data-state="error"] {
        background: var(--danger);
      }

      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      .summary {
        padding: 4px 16px 16px;
      }

      .headline {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.01em;
      }

      .status {
        max-width: 45%;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .metric {
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-muted);
      }

      .metric-label {
        display: block;
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .metric-value {
        display: block;
        overflow-wrap: anywhere;
        font-size: 14px;
        font-weight: 650;
      }

      .controls {
        display: flex;
        gap: 8px;
        padding: 12px 16px 14px;
        border-top: 1px solid var(--border);
      }

      button {
        min-height: 36px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        padding: 7px 12px;
      }

      button:hover:not(:disabled) {
        border-color: var(--accent);
      }

      button:focus-visible,
      .text-button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--focus) 35%, transparent);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.58;
      }

      .primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .primary:hover:not(:disabled) {
        border-color: var(--accent);
        filter: brightness(0.94);
      }

      .text-button {
        margin: 0 16px 10px;
        padding: 2px 0;
        border: 0;
        background: transparent;
        color: var(--accent);
        font-size: 12px;
        font-weight: 650;
      }

      .notice,
      .error {
        margin: 0 16px 12px;
        font-size: 12px;
      }

      .notice {
        color: var(--muted);
      }

      .error {
        color: var(--danger);
      }

      .details-panel {
        margin: 0 16px 16px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .details-panel[hidden] {
        display: none;
      }

      .details-panel h2 {
        margin: 0 0 8px;
        font-size: 13px;
      }

      .detail-line {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        padding: 4px 0;
        color: var(--muted);
        font-size: 12px;
      }

      .detail-line strong {
        color: var(--text);
        font-weight: 600;
        text-align: right;
        overflow-wrap: anywhere;
      }

      [aria-busy="true"] .metric-value {
        opacity: 0.72;
      }

      @media (max-width: 340px) {
        .widget {
          padding: 8px;
        }

        .header,
        .summary,
        .controls {
          padding-left: 12px;
          padding-right: 12px;
        }

        .notice,
        .error,
        .text-button,
        .details-panel {
          margin-left: 12px;
          margin-right: 12px;
        }
      }
    </style>
  </head>
  <body data-display-mode="compact">
    <main class="widget" id="widget" aria-labelledby="title">
      <div class="shell">
        <header class="header">
          <div class="eyebrow">
            <span class="signal" id="signal" data-state="unknown" aria-hidden="true"></span>
            <span>FlowPilot telemetry</span>
          </div>
          <span class="mode" id="modeLabel">Compact view</span>
        </header>

        <section class="summary" id="summary" aria-busy="false">
          <div class="headline">
            <h1 id="title">Latest run</h1>
            <span class="status" id="statusValue">Unavailable</span>
          </div>

          <div class="metrics" aria-label="Telemetry summary">
            <div class="metric">
              <span class="metric-label">Session</span>
              <span class="metric-value" id="sessionValue">Unavailable</span>
            </div>
            <div class="metric">
              <span class="metric-label">Project</span>
              <span class="metric-value" id="projectValue">Unavailable</span>
            </div>
            <div class="metric">
              <span class="metric-label">Duration</span>
              <span class="metric-value" id="durationValue">Unavailable</span>
            </div>
            <div class="metric">
              <span class="metric-label">Participants</span>
              <span class="metric-value" id="participantsValue">Unavailable</span>
            </div>
            <div class="metric">
              <span class="metric-label">Tokens</span>
              <span class="metric-value" id="tokensValue">Unavailable</span>
            </div>
            <div class="metric">
              <span class="metric-label">Quota</span>
              <span class="metric-value" id="quotaValue">Unavailable</span>
            </div>
            <div class="metric">
              <span class="metric-label">Last updated</span>
              <span class="metric-value" id="updatedValue">Unavailable</span>
            </div>
          </div>
        </section>

        <div class="controls" aria-label="Telemetry controls">
          <button class="primary" id="pinButton" type="button" aria-label="Keep telemetry visible in Picture-in-picture">Pin</button>
          <button id="refreshButton" type="button" aria-label="Refresh latest FlowPilot telemetry">Refresh</button>
        </div>

        <button class="text-button" id="detailsButton" type="button" aria-label="Expand telemetry details">Details / expand</button>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
        <p class="error" id="error" role="alert" aria-live="assertive" hidden></p>

        <section class="details-panel" id="detailsPanel" aria-labelledby="detailsTitle" hidden>
          <h2 id="detailsTitle">Available details</h2>
          <div class="detail-line"><span>Parent model</span><strong id="modelValue">Unavailable</strong></div>
          <div class="detail-line"><span>Branch</span><strong id="branchValue">Unavailable</strong></div>
          <div class="detail-line"><span>Quota reset</span><strong id="resetValue">Unavailable</strong></div>
        </section>
      </div>
    </main>

    <script>
      (() => {
        "use strict";

        const UNAVAILABLE = "Unavailable";
        const state = {
          data: null,
          detailsOpen: false,
          displayMode: "compact",
          error: "",
          loading: false,
          notice: ""
        };

        const elements = {
          branch: document.getElementById("branchValue"),
          detailsButton: document.getElementById("detailsButton"),
          detailsPanel: document.getElementById("detailsPanel"),
          error: document.getElementById("error"),
          modeLabel: document.getElementById("modeLabel"),
          model: document.getElementById("modelValue"),
          notice: document.getElementById("notice"),
          pinButton: document.getElementById("pinButton"),
          project: document.getElementById("projectValue"),
          quota: document.getElementById("quotaValue"),
          refreshButton: document.getElementById("refreshButton"),
          reset: document.getElementById("resetValue"),
          session: document.getElementById("sessionValue"),
          signal: document.getElementById("signal"),
          status: document.getElementById("statusValue"),
          summary: document.getElementById("summary"),
          tokens: document.getElementById("tokensValue"),
          updated: document.getElementById("updatedValue"),
          duration: document.getElementById("durationValue"),
          participants: document.getElementById("participantsValue")
        };

        const DIRECT_KEYS = new Set([
          "status", "state", "session", "session_id", "sessionId", "project", "project_name",
          "projectName", "duration", "duration_ms", "durationMs", "participants", "workers",
          "parent", "tokens", "total_tokens", "totalTokens", "usage", "quota", "quota_windows",
          "quotaWindows", "last_updated", "lastUpdated", "updated_at", "updatedAt", "thread",
          "started_at_ms", "startedAtMs", "finished_at_ms", "finishedAtMs"
        ]);

        const ENVELOPE_KEYS = new Set([
          "type", "method", "event", "name", "id", "jsonrpc", "params", "result", "payload",
          "data", "content", "structuredContent", "notification", "text", "isError", "error",
          "telemetry", "toolResult", "tool_result"
        ]);

        function isRecord(value) {
          return value !== null && typeof value === "object" && !Array.isArray(value);
        }

        function hasValue(value) {
          return value !== undefined && value !== null && value !== "";
        }

        function parseJson(value) {
          if (typeof value !== "string") return value;
          const text = value.trim();
          if (!text || (text[0] !== "{" && text[0] !== "[")) return value;
          try {
            return JSON.parse(text);
          } catch (_error) {
            return value;
          }
        }

        // MCP Apps hosts and tool bridges have used both direct structuredContent
        // and result/content envelopes. Keep the parser permissive but bounded.
        function extractStructuredContent(value, depth = 0) {
          if (depth > 8 || value === undefined || value === null) return null;
          const parsed = parseJson(value);
          if (parsed !== value) return extractStructuredContent(parsed, depth + 1);
          if (Array.isArray(value)) {
            for (const item of value) {
              const found = extractStructuredContent(item, depth + 1);
              if (found) return found;
            }
            return null;
          }
          if (!isRecord(value)) return null;

          if (Object.prototype.hasOwnProperty.call(value, "structuredContent")) {
            const found = extractStructuredContent(value.structuredContent, depth + 1);
            if (found) return found;
          }

          for (const key of ["result", "payload", "params", "data", "json", "telemetry", "toolResult", "tool_result"]) {
            if (Object.prototype.hasOwnProperty.call(value, key)) {
              const found = extractStructuredContent(value[key], depth + 1);
              if (found) return found;
            }
          }

          if (Object.prototype.hasOwnProperty.call(value, "content")) {
            const found = extractStructuredContent(value.content, depth + 1);
            if (found) return found;
          }

          if (typeof value.text === "string") {
            const found = extractStructuredContent(value.text, depth + 1);
            if (found) return found;
          }

          const keys = Object.keys(value);
          const hasTelemetryKey = keys.some((key) => DIRECT_KEYS.has(key));
          if (hasTelemetryKey || keys.some((key) => !ENVELOPE_KEYS.has(key))) return value;
          return null;
        }

        function getHost() {
          try {
            return isRecord(window.openai) ? window.openai : null;
          } catch (_error) {
            return null;
          }
        }

        function getAt(object, path) {
          return path.split(".").reduce((current, key) => {
            if (current === undefined || current === null) return undefined;
            return current[key];
          }, object);
        }

        function firstValue(object, paths) {
          for (const path of paths) {
            const value = getAt(object, path);
            if (hasValue(value)) return value;
          }
          return undefined;
        }

        function asNumber(value) {
          if (typeof value === "number" && Number.isFinite(value)) return value;
          if (typeof value === "string" && value.trim() !== "") {
            const parsed = Number(value);
            if (Number.isFinite(parsed)) return parsed;
          }
          return null;
        }

        function asText(value) {
          if (typeof value === "string" && value.trim()) return value.trim();
          if (typeof value === "number" && Number.isFinite(value)) return String(value);
          if (typeof value === "boolean") return value ? "Yes" : "No";
          return UNAVAILABLE;
        }

        function formatNumber(value) {
          const number = asNumber(value);
          if (number === null) return UNAVAILABLE;
          return new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 }).format(number);
        }

        function formatTokens(value) {
          const number = asNumber(value);
          if (number === null) return UNAVAILABLE;
          if (Math.abs(number) < 1000) return formatNumber(number);
          const units = ["k", "M", "B"];
          let scaled = number;
          let unit = "";
          for (const nextUnit of units) {
            if (Math.abs(scaled) < 1000) break;
            scaled /= 1000;
            unit = nextUnit;
          }
          return `${new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 }).format(scaled)}${unit}`;
        }

        function formatDuration(milliseconds) {
          const value = asNumber(milliseconds);
          if (value === null || value < 0) return UNAVAILABLE;
          const totalSeconds = Math.floor(value / 1000);
          if (totalSeconds < 1) return "<1s";
          const hours = Math.floor(totalSeconds / 3600);
          const minutes = Math.floor((totalSeconds % 3600) / 60);
          const seconds = totalSeconds % 60;
          const parts = [];
          if (hours) parts.push(`${hours}h`);
          if (minutes || hours) parts.push(`${minutes}m`);
          if (!hours && seconds) parts.push(`${seconds}s`);
          return parts.join(" ");
        }

        function formatTimestamp(value) {
          const number = asNumber(value);
          const date = number === null
            ? new Date(typeof value === "string" ? value : NaN)
            : new Date(number < 100000000000 ? number * 1000 : number);
          if (Number.isNaN(date.getTime())) return asText(value);
          return new Intl.DateTimeFormat(undefined, {
            dateStyle: "medium",
            timeStyle: "short"
          }).format(date);
        }

        function basename(path) {
          if (typeof path !== "string" || !path.trim()) return UNAVAILABLE;
          const pieces = path.replace(/[\\/]+$/, "").split(/[\\/]/);
          return pieces[pieces.length - 1] || UNAVAILABLE;
        }

        function sessionText(data) {
          return asText(firstValue(data, [
            "session", "session_name", "sessionName", "session_id", "sessionId",
            "thread.name", "thread.title", "thread.preview", "thread.id"
          ]));
        }

        function projectText(data) {
          const project = firstValue(data, [
            "project", "project_name", "projectName", "thread.project", "thread.projectName"
          ]);
          const branch = firstValue(data, ["branch", "git_branch", "gitBranch", "thread.gitInfo.branch"]);
          const projectValue = hasValue(project) ? asText(project) : basename(firstValue(data, ["cwd", "thread.cwd"]));
          if (projectValue === UNAVAILABLE) return UNAVAILABLE;
          return hasValue(branch) ? `${projectValue} · ${asText(branch)}` : projectValue;
        }

        function durationText(data) {
          const direct = firstValue(data, ["duration", "duration_text", "durationText"]);
          if (typeof direct === "string" && direct.trim()) return direct.trim();
          const milliseconds = firstValue(data, ["duration_ms", "durationMs", "elapsed_ms", "elapsedMs"]);
          if (asNumber(milliseconds) !== null) return formatDuration(milliseconds);
          const seconds = firstValue(data, ["duration_seconds", "durationSeconds"]);
          if (asNumber(seconds) !== null) return formatDuration(asNumber(seconds) * 1000);
          const started = asNumber(firstValue(data, ["started_at_ms", "startedAtMs", "started_at", "startedAt"]));
          const finished = asNumber(firstValue(data, ["finished_at_ms", "finishedAtMs", "finished_at", "finishedAt"]));
          if (started !== null && finished !== null) {
            const startMs = started < 100000000000 ? started * 1000 : started;
            const finishMs = finished < 100000000000 ? finished * 1000 : finished;
            return formatDuration(finishMs - startMs);
          }
          return UNAVAILABLE;
        }

        function countCollection(value) {
          if (Array.isArray(value)) return value.length;
          if (isRecord(value)) return Object.keys(value).length;
          return null;
        }

        function participantsText(data) {
          const direct = firstValue(data, ["participants", "participant_count", "participantCount"]);
          if (typeof direct === "string" || typeof direct === "number") return asText(direct);
          if (Array.isArray(direct)) return formatNumber(direct.length);
          if (isRecord(direct)) {
            const total = firstValue(direct, ["total", "count", "total_count", "totalCount"]);
            if (hasValue(total)) return formatNumber(total);
          }

          const hasParent = isRecord(data.parent) || hasValue(data.parent);
          const workerCount = countCollection(data.workers);
          if (hasParent && workerCount !== null) {
            return `1 parent + ${formatNumber(workerCount)} worker${workerCount === 1 ? "" : "s"}`;
          }
          if (workerCount !== null) return formatNumber(workerCount);
          return UNAVAILABLE;
        }

        function usageTotal(data) {
          const direct = firstValue(data, [
            "total_tokens", "totalTokens", "attributed_tokens", "attributedTokens",
            "tokens.total", "tokens.total_tokens", "tokens.totalTokens", "usage.total_tokens", "usage.totalTokens"
          ]);
          if (asNumber(direct) !== null) return asNumber(direct);

          const usages = [];
          if (isRecord(data.parent)) usages.push(firstValue(data.parent, ["usage_delta.total_tokens", "usage_delta.totalTokens", "usage.total_tokens", "usage.totalTokens"]));
          if (isRecord(data.workers)) {
            for (const worker of Object.values(data.workers)) {
              if (isRecord(worker)) usages.push(firstValue(worker, ["usage.total_tokens", "usage.totalTokens", "usage_delta.total_tokens", "usage_delta.totalTokens"]));
            }
          }
          if (usages.length && usages.every((value) => asNumber(value) !== null)) {
            return usages.reduce((sum, value) => sum + asNumber(value), 0);
          }
          return null;
        }

        function tokensText(data) {
          const total = usageTotal(data);
          if (total !== null) return `${formatTokens(total)} total`;
          const input = firstValue(data, ["tokens.input", "tokens.input_tokens", "usage.input_tokens", "usage.inputTokens"]);
          const output = firstValue(data, ["tokens.output", "tokens.output_tokens", "usage.output_tokens", "usage.outputTokens"]);
          const parts = [];
          if (asNumber(input) !== null) parts.push(`${formatTokens(input)} in`);
          if (asNumber(output) !== null) parts.push(`${formatTokens(output)} out`);
          return parts.length ? parts.join(" · ") : UNAVAILABLE;
        }

        function quotaWindows(data) {
          const candidates = [
            firstValue(data, ["quota.windows", "quotaWindows", "quota_windows", "account_quota.windows"]),
            firstValue(data, ["quota_change_during_run", "quota_before", "quota_after"]),
            firstValue(data, ["quota", "account_quota"])
          ];
          for (const candidate of candidates) {
            if (Array.isArray(candidate)) return candidate.filter(isRecord);
            if (isRecord(candidate)) {
              if (Array.isArray(candidate.windows)) return candidate.windows.filter(isRecord);
              if (firstValue(candidate, ["used_percent", "usedPercent", "remaining", "remaining_percent", "remainingPercent"]) !== undefined) return [candidate];
            }
          }
          return [];
        }

        function windowLabel(window) {
          const explicit = firstValue(window, ["label", "name", "window"]);
          if (hasValue(explicit) && typeof explicit !== "object") return asText(explicit);
          const minutes = asNumber(firstValue(window, ["window_duration_mins", "windowDurationMins", "duration_mins", "durationMins"]));
          if (minutes === null) return "Quota";
          if (minutes % 10080 === 0) return `${minutes / 10080}w`;
          if (minutes % 1440 === 0) return `${minutes / 1440}d`;
          if (minutes % 60 === 0) return `${minutes / 60}h`;
          return `${minutes}m`;
        }

        function percentText(value) {
          const number = asNumber(value);
          if (number === null) return UNAVAILABLE;
          return `${new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 }).format(number)}%`;
        }

        function quotaText(data) {
          const pieces = quotaWindows(data).map((window) => {
            const label = windowLabel(window);
            const used = firstValue(window, ["used_percent", "usedPercent", "used"]);
            const remaining = firstValue(window, ["remaining_percent", "remainingPercent", "remaining"]);
            if (asNumber(used) !== null) return `${label}: ${percentText(used)} used`;
            if (asNumber(remaining) !== null) return `${label}: ${percentText(remaining)} remaining`;
            return null;
          }).filter(Boolean);
          return pieces.length ? pieces.join(" · ") : UNAVAILABLE;
        }

        function latestTimestamp(data) {
          return firstValue(data, [
            "last_updated", "lastUpdated", "updated_at", "updatedAt", "finished_at_ms", "finishedAtMs",
            "completed_at_ms", "completedAtMs"
          ]);
        }

        function resetText(data) {
          const window = quotaWindows(data)[0];
          return window ? formatTimestamp(firstValue(window, ["resets_at", "resetsAt", "reset_at", "resetAt"])) : UNAVAILABLE;
        }

        function updateText(element, value) {
          element.textContent = hasValue(value) ? String(value) : UNAVAILABLE;
        }

        function displayModeFrom(value) {
          if (!isRecord(value)) return null;
          const candidate = firstValue(value, ["displayMode", "display_mode", "displayMode.mode", "display_mode.mode", "mode", "params.displayMode", "params.display_mode"]);
          if (typeof candidate === "string") return candidate.toLowerCase();
          return null;
        }

        function applyDisplayMode(mode) {
          if (typeof mode !== "string" || !mode) return;
          state.displayMode = mode.toLowerCase();
          if (state.displayMode === "fullscreen") state.detailsOpen = true;
          document.body.dataset.displayMode = state.displayMode;
          elements.modeLabel.textContent = state.displayMode === "pip" ? "Picture-in-picture" : state.displayMode === "fullscreen" ? "Expanded view" : "Compact view";
          elements.pinButton.textContent = state.displayMode === "pip" ? "Keep visible" : "Pin";
          elements.pinButton.setAttribute("aria-pressed", String(state.displayMode === "pip"));
        }

        function render() {
          const data = isRecord(state.data) ? state.data : {};
          updateText(elements.status, firstValue(data, ["status", "state", "run_status", "runStatus"]));
          updateText(elements.session, sessionText(data));
          updateText(elements.project, projectText(data));
          updateText(elements.duration, durationText(data));
          updateText(elements.participants, participantsText(data));
          updateText(elements.tokens, tokensText(data));
          updateText(elements.quota, quotaText(data));
          const timestamp = latestTimestamp(data);
          updateText(elements.updated, hasValue(timestamp) ? formatTimestamp(timestamp) : UNAVAILABLE);
          updateText(elements.model, firstValue(data, ["parent.model", "model"]));
          updateText(elements.branch, firstValue(data, ["branch", "git_branch", "gitBranch", "thread.gitInfo.branch"]));
          updateText(elements.reset, resetText(data));

          elements.summary.setAttribute("aria-busy", String(state.loading));
          elements.refreshButton.disabled = state.loading;
          elements.refreshButton.textContent = state.loading ? "Loading…" : "Refresh";
          elements.detailsPanel.hidden = !state.detailsOpen;
          elements.notice.textContent = state.notice;
          elements.error.textContent = state.error;
          elements.error.hidden = !state.error;
          elements.signal.dataset.state = state.loading ? "loading" : state.error ? "error" : state.data ? "ready" : "unknown";
          applyDisplayMode(state.displayMode);
        }

        async function refreshTelemetry(silent = false) {
          if (state.loading) return;
          const host = getHost();
          if (!host || typeof host.callTool !== "function") {
            if (!silent) {
              state.error = "Refresh is unavailable outside the ChatGPT host.";
              state.notice = "The compact view remains available.";
              render();
            }
            return;
          }

          state.loading = true;
          state.error = "";
          state.notice = "Loading latest telemetry…";
          render();
          try {
            const result = await host.callTool("flowpilot_get_telemetry", { target: "last" });
            const structured = extractStructuredContent(result);
            if (!structured) throw new Error("No structured telemetry result");
            state.data = structured;
            state.notice = "Telemetry updated.";
          } catch (_error) {
            state.error = "Unable to load the latest telemetry.";
            state.notice = "The last available view is still shown.";
          } finally {
            state.loading = false;
            render();
          }
        }

        async function pinWidget() {
          if (state.displayMode === "pip") {
            state.notice = "Telemetry is already kept visible.";
            state.error = "";
            render();
            return;
          }
          const host = getHost();
          if (!host || typeof host.requestDisplayMode !== "function") {
            state.notice = "Pin is unavailable in this host; the compact view remains available.";
            state.error = "";
            render();
            return;
          }
          state.notice = "Requesting Picture-in-picture…";
          state.error = "";
          render();
          try {
            const result = await host.requestDisplayMode({ mode: "pip" });
            applyDisplayMode(displayModeFrom(result) || displayModeFrom(host) || "pip");
            state.notice = state.displayMode === "pip" ? "Telemetry will stay visible in Picture-in-picture." : "Pin was not granted; telemetry remains available.";
          } catch (_error) {
            state.notice = "Pin was declined; telemetry remains available here.";
          }
          render();
        }

        async function expandDetails() {
          if (state.displayMode === "fullscreen") {
            state.detailsOpen = !state.detailsOpen;
            render();
            return;
          }
          const host = getHost();
          if (host && typeof host.requestDisplayMode === "function") {
            state.notice = "Requesting expanded details…";
            state.error = "";
            render();
            try {
              const result = await host.requestDisplayMode({ mode: "fullscreen" });
              const mode = displayModeFrom(result) || displayModeFrom(host) || "fullscreen";
              if (mode) applyDisplayMode(mode);
              state.detailsOpen = true;
              state.notice = mode === "fullscreen" ? "Expanded details are available." : "Fullscreen was not granted; showing available details.";
            } catch (_error) {
              state.detailsOpen = true;
              state.notice = "Fullscreen was not granted; showing available details.";
            }
            render();
            return;
          }

          if (document.documentElement && typeof document.documentElement.requestFullscreen === "function") {
            try {
              await document.documentElement.requestFullscreen();
              applyDisplayMode("fullscreen");
              state.notice = "Expanded details are available.";
            } catch (_error) {
              state.detailsOpen = true;
              state.notice = "Fullscreen is unavailable; showing available details.";
            }
          } else {
            state.detailsOpen = true;
            state.notice = "Fullscreen is unavailable; showing available details.";
          }
          render();
        }

        function isToolResultMessage(value) {
          if (!isRecord(value)) return false;
          const label = [value.type, value.method, value.event, value.name].filter((item) => typeof item === "string").join(" ").toLowerCase();
          return label.includes("ui/notifications/tool-result") || label.includes("tool-result") || label.includes("tool_result");
        }

        function handleHostMessage(event) {
          const message = parseJson(event && event.data);
          if (!isRecord(message)) return;
          const mode = displayModeFrom(message);
          const label = [message.type, message.method, message.event, message.name].filter((item) => typeof item === "string").join(" ").toLowerCase();
          if (mode && (label.includes("display-mode") || label.includes("display_mode"))) applyDisplayMode(mode);
          if (isToolResultMessage(message)) {
            const structured = extractStructuredContent(message);
            if (structured) {
              state.data = structured;
              state.error = "";
              state.notice = "Telemetry updated by the host.";
              render();
            }
          }
        }

        function handleToolResultEvent(event) {
          const structured = extractStructuredContent(event && (event.detail || event.data || event));
          if (structured) {
            state.data = structured;
            state.error = "";
            state.notice = "Telemetry updated by the host.";
            render();
          }
        }

        elements.pinButton.addEventListener("click", () => { void pinWidget(); });
        elements.refreshButton.addEventListener("click", () => { void refreshTelemetry(); });
        elements.detailsButton.addEventListener("click", () => { void expandDetails(); });
        window.addEventListener("message", handleHostMessage);
        window.addEventListener("ui/notifications/tool-result", handleToolResultEvent);
        window.addEventListener("tool-result", handleToolResultEvent);
        document.addEventListener("fullscreenchange", () => {
          if (document.fullscreenElement) applyDisplayMode("fullscreen");
        });

        const host = getHost();
        const initial = host ? extractStructuredContent(host.toolOutput) : null;
        if (initial) state.data = initial;
        const initialMode = host ? displayModeFrom(host) : null;
        if (initialMode) applyDisplayMode(initialMode);
        render();
        if (!initial && host && typeof host.callTool === "function") void refreshTelemetry(true);
      })();
    </script>
  </body>
</html>
