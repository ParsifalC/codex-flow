name: ota-ci

# Validate the same release/update contract consumed by CLI and FlowPilot.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/updater.py'
      - 'scripts/package-release.py'
      - 'scripts/generate-release-manifest.py'
      - 'scripts/migrations/**'
      - 'tests/test_updater.py'
      - 'install.sh'
      - 'install.ps1'
      - 'bin/codex-flow'
      - 'bin/codex-flow.ps1'
      - 'scripts/menu.py'
      - 'apps/macos-overlay/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/ota-ci.yml'
  pull_request:
    paths:
      - 'scripts/updater.py'
      - 'scripts/package-release.py'
      - 'scripts/generate-release-manifest.py'
      - 'scripts/migrations/**'
      - 'tests/test_updater.py'
      - 'install.sh'
      - 'install.ps1'
      - 'bin/codex-flow'
      - 'bin/codex-flow.ps1'
      - 'scripts/menu.py'
      - 'apps/macos-overlay/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/ota-ci.yml'

jobs:
  updater:
    name: updater-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile updater modules
        shell: bash
        run: |
          python3 -m py_compile \
            scripts/updater.py \
            scripts/package-release.py \
            scripts/generate-release-manifest.py \
            scripts/migrations/0001_update_settings.py
      - name: Guard Windows PowerShell 5 installer encoding
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $path = Join-Path (Get-Location) 'install.ps1'
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xef -or $bytes[1] -ne 0xbb -or $bytes[2] -ne 0xbf) {
            throw 'install.ps1 must retain its UTF-8 BOM for Windows PowerShell 5 localized parsing'
          }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "install.ps1:$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
      - name: OTA updater tests
        shell: bash
        run: python3 -m unittest tests.test_updater
      - name: Package release artifact
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            platform="windows-x86_64"
          else
            platform="linux-x86_64"
          fi
          python3 scripts/package-release.py --platform "$platform" --output-dir dist
          python3 scripts/generate-release-manifest.py --dist dist --tag "v$(tr -d '\r\n' < VERSION)" --output dist/codex-flow-update.json
          test -s dist/codex-flow-update.json

  macos-app:
    name: macos-app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: OTA updater tests
        run: python3 -m unittest tests.test_updater
      - name: Build FlowPilot with update UI
        run: bash apps/macos-overlay/build.sh
      - name: Package macOS OTA artifact
        run: |
          python3 scripts/package-release.py --platform darwin-arm64 --output-dir dist
          python3 scripts/generate-release-manifest.py --dist dist --tag "v$(tr -d '\r\n' < VERSION)" --output dist/codex-flow-update.json
          test -s dist/codex-flow-update.json
