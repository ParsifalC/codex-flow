name: ci

on:
  push:
  pull_request:

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          bash -n install.sh
          bash -n bin/codex-flow
          bash -n bin/codex-flow-mcp
          bash -n completions/codex-flow.bash
          bash -n scripts/doctor
          bash -n scripts/uninstall
          bash -n tests/smoke.sh
          bash -n tests/strategy-runtime.sh
          bash -n tests/lifecycle-runtime.sh
          bash -n tests/account-snapshot.sh
          bash -n tests/telemetry.sh
          bash -n tests/chatgpt-mcp.sh
          bash -n tests/benchmark.sh
          bash -n tests/runner.sh
          bash -n tests/corpus.sh
          bash -n tests/report.sh
          python3 -m py_compile scripts/strategy_runtime.py
          python3 -m py_compile scripts/strategies/lifecycle_runtime.py
          python3 -m py_compile scripts/check-recommendation.py
          python3 -m py_compile scripts/analyze-benchmark.py
          python3 -m py_compile scripts/run-benchmark.py
          python3 -m py_compile scripts/materialize-corpus.py
          python3 -m py_compile scripts/manage-shell.py
          python3 -m py_compile scripts/manage-hooks.py
          python3 -m py_compile scripts/telemetry.py
          python3 -m py_compile scripts/menu.py
          python3 -m py_compile scripts/telemetry_core/__init__.py
          python3 -m py_compile scripts/telemetry_core/app_server.py
          python3 -m py_compile scripts/telemetry_core/collector.py
          python3 -m py_compile scripts/telemetry_core/common.py
          python3 -m py_compile scripts/telemetry_core/query.py
          python3 -m py_compile scripts/telemetry_core/render.py
          python3 -m py_compile apps/chatgpt-mcp/__init__.py
          python3 -m py_compile apps/chatgpt-mcp/adapter.py
          python3 -m py_compile apps/chatgpt-mcp/server.py
          python3 -m py_compile scripts/render-benchmark-report.py
          python3 -m py_compile scripts/benchmark-local.py
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.parse_file(f) }'
      - name: Strategy runtime test
        run: bash tests/strategy-runtime.sh
      - name: Lifecycle runtime and restored regression test
        run: bash tests/lifecycle-runtime.sh
      - name: Recommendation policy test
        run: |
          python3 scripts/check-recommendation.py --fixture tests/fixtures/models.json --json | tee /tmp/recommendation.json
          grep -Fq '"parent_recommended_model": "gpt-5.6-sol"' /tmp/recommendation.json
          grep -Fq '"worker_model": "gpt-5.6-luna"' /tmp/recommendation.json
          cp policy/defaults.toml /tmp/defaults.toml
          sed -i 's/worker_model = "gpt-5.6-luna"/worker_model = "gpt-5.6-terra"/' /tmp/defaults.toml
          python3 scripts/check-recommendation.py --fixture tests/fixtures/models.json --defaults /tmp/defaults.toml --write --json >/tmp/recommendation-write.json
          grep -Fq 'worker_model = "gpt-5.6-luna"' /tmp/defaults.toml
          grep -Fq '"changed": true' /tmp/recommendation-write.json
      - name: Benchmark routing test
        run: bash tests/benchmark.sh
      - name: Benchmark runner test
        run: bash tests/runner.sh
      - name: Benchmark corpus test
        run: bash tests/corpus.sh
      - name: Benchmark report test
        run: bash tests/report.sh
      - name: FlowPilot telemetry test
        run: bash tests/telemetry.sh
      - name: ChatGPT MCP test
        run: bash tests/chatgpt-mcp.sh
      - name: Installer and CLI smoke test
        run: bash tests/smoke.sh

  windows-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell entrypoints
        run: |
          $files = @('install.ps1','bin/codex-flow.ps1','scripts/doctor.ps1','scripts/uninstall.ps1')
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }
      - name: Installer and CLI smoke test
        run: |
          $root = (Get-Location).Path
          $tmp = Join-Path $env:RUNNER_TEMP ('codex-flow-smoke-' + '${{ matrix.shell }}')
          $env:CODEX_HOME = Join-Path $tmp '.codex'
          $env:CODEX_FLOW_BIN_DIR = Join-Path $tmp 'bin-installed'
          $fakeBin = Join-Path $tmp 'bin'
          New-Item -ItemType Directory -Force -Path $env:CODEX_HOME,$env:CODEX_FLOW_BIN_DIR,$fakeBin | Out-Null
          $utf8NoBom = New-Object -TypeName System.Text.UTF8Encoding -ArgumentList $false
          [System.IO.File]::WriteAllText((Join-Path $fakeBin 'codex.cmd'), "@echo off" + [Environment]::NewLine + "echo codex-test 0.0.0" + [Environment]::NewLine, $utf8NoBom)
          [System.IO.File]::WriteAllText((Join-Path $fakeBin 'git.cmd'), "@echo off" + [Environment]::NewLine + "exit /b 0" + [Environment]::NewLine, $utf8NoBom)
          $env:PATH = "$fakeBin;$env:CODEX_FLOW_BIN_DIR;$env:PATH"
          $sentinel = [string][char]0x4f60 + [string][char]0x597d
          $configText = 'model = "user-parent-model"' + [Environment]::NewLine + 'model_reasoning_effort = "high"' + [Environment]::NewLine + '# non-ASCII sentinel: ' + $sentinel + [Environment]::NewLine + [Environment]::NewLine + '[unrelated]' + [Environment]::NewLine + 'keep_me = true' + [Environment]::NewLine
          [System.IO.File]::WriteAllText((Join-Path $env:CODEX_HOME 'config.toml'), $configText, $utf8NoBom)

          $installExit = 0
          try {
            $installOutput = (& "$root\install.ps1" *>&1 | Out-String)
            if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { $installExit = $LASTEXITCODE }
          } catch {
            $installOutput = $_ | Out-String
            $installExit = 1
          }
          $installOutput
          if ($installExit -ne 0) { exit $installExit }
          foreach ($expected in @(
            'REQUIRED NEXT STEPS',
            'Complete Codex Restart',
            'Fully quit Codex and relaunch it',
            'Authorize Hooks',
            '/hooks'
          )) {
            if (-not $installOutput.Contains($expected)) { throw "installer reminder missing: $expected" }
          }
          & (Join-Path $env:CODEX_FLOW_BIN_DIR 'codex-flow.cmd') status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $strategyOutput = (& (Join-Path $env:CODEX_FLOW_BIN_DIR 'codex-flow.cmd') strategy show | Out-String).Trim()
          if ($strategyOutput -ne 'enabled=true strategy=efficient routing=adaptive') { throw "unexpected strategy output: $strategyOutput" }
          $bareStrategyOutput = (& (Join-Path $env:CODEX_FLOW_BIN_DIR 'codex-flow.cmd') strategy | Out-String).Trim()
          if ($bareStrategyOutput -ne 'enabled=true strategy=efficient routing=adaptive') { throw "unexpected bare strategy output: $bareStrategyOutput" }
          $doctorOutput = (& (Join-Path $env:CODEX_FLOW_BIN_DIR 'codex-flow.cmd') doctor 2>&1 | Out-String)
          $doctorExit = $LASTEXITCODE
          if ($doctorExit -ne 0) { exit $doctorExit }
          if ($doctorOutput -notmatch 'thread-attributed telemetry may be unavailable') { throw 'old Codex compatibility warning missing' }
          if ($doctorOutput -notmatch 'review modifier: auto') { throw 'review modifier doctor check missing' }
          if ($doctorOutput -notmatch 'fanout modifier: auto') { throw 'fanout modifier doctor check missing' }

          $config = [System.IO.File]::ReadAllText((Join-Path $env:CODEX_HOME 'config.toml'), $utf8NoBom)
          if (-not $config.Contains('# non-ASCII sentinel: ' + $sentinel)) { throw 'non-ASCII config sentinel was not preserved after install' }
          if ($config -notmatch 'default_subagent_model\s*=\s*"gpt-5\.6-luna"') { throw 'worker model was not installed' }
          $policyPath = Join-Path $env:CODEX_HOME 'codex-flow.toml'
          $policy = [System.IO.File]::ReadAllText($policyPath, $utf8NoBom)
          if ($policy -notmatch 'schema_version\s*=\s*4') { throw 'policy schema was not upgraded to v4' }
          if ($policy -notmatch 'profile\s*=\s*"efficient"') { throw 'default strategy profile missing' }
          if ($policy -notmatch 'mode\s*=\s*"adaptive"') { throw 'default routing mode missing' }
          if ($policy -notmatch 'model\s*=\s*"auto"') { throw 'auto worker policy was not preserved' }
          $binState = Join-Path $env:CODEX_HOME 'codex-flow/bin_dir'
          if (-not ([System.IO.File]::ReadAllText($binState, $utf8NoBom).Trim() -eq $env:CODEX_FLOW_BIN_DIR)) { throw 'custom bin directory was not persisted' }
          if (-not (Test-Path (Join-Path $env:CODEX_HOME 'codex-flow/defaults.toml'))) { throw 'release defaults were not installed' }
          $policyBytes = [System.IO.File]::ReadAllBytes($policyPath)
          if ($policyBytes.Length -ge 3 -and $policyBytes[0] -eq 0xef -and $policyBytes[1] -eq 0xbb -and $policyBytes[2] -eq 0xbf) { throw 'policy unexpectedly has a UTF-8 BOM' }
          if (-not (Test-Path (Join-Path $env:CODEX_HOME 'skills/flow-pilot/SKILL.md'))) { throw 'FlowPilot skill missing' }
          if (-not (Test-Path (Join-Path $env:CODEX_HOME 'codex-flow/strategy_runtime.py'))) { throw 'strategy runtime helper missing' }
          $lifecycleHelper = Join-Path $env:CODEX_HOME 'codex-flow/strategies/lifecycle_runtime.py'
          if (-not (Test-Path $lifecycleHelper)) { throw 'lifecycle runtime helper missing' }
          & python3 -m py_compile $lifecycleHelper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $env:CODEX_HOME 'hooks.json'))) { throw 'telemetry hooks missing' }

          # Change every policy family that reinstall/update must round-trip without loss.
          $policy = $policy.Replace('profile = "efficient"', 'profile = "balanced"')
          $policy = $policy.Replace('mode = "adaptive"', 'mode = "delegate"')
          $policy = $policy.Replace('review = "auto"', 'review = "strict"')
          $policy = $policy.Replace('fanout = "auto"', 'fanout = "conservative"')
          $policy = $policy.Replace('routine_effort = "high"', 'routine_effort = "xhigh"')
          $policy = $policy.Replace('complex_effort = "xhigh"', 'complex_effort = "max"')
          $policy = $policy.Replace('max_concurrent_threads = 4', 'max_concurrent_threads = 3')
          $policy = $policy.Replace('max_repair_cycles = 2', 'max_repair_cycles = 1')
          $policy = $policy.Replace('notifications = true', 'notifications = false')
          $policy = $policy.Replace('retention_days = 30', 'retention_days = 17')
          [System.IO.File]::WriteAllText($policyPath, $policy, $utf8NoBom)

          # Reinstall must preserve the customized policy, not reset it to release defaults.
          & "$root\install.ps1" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $policy = [System.IO.File]::ReadAllText($policyPath, $utf8NoBom)
          foreach ($expected in @(
            'profile = "balanced"', 'mode = "delegate"', 'review = "strict"', 'fanout = "conservative"',
            'routine_effort = "xhigh"', 'complex_effort = "max"', 'max_concurrent_threads = 3',
            'max_repair_cycles = 1', 'notifications = false', 'retention_days = 17'
          )) {
            if (-not $policy.Contains($expected)) { throw "policy value lost on reinstall: $expected" }
          }

          & (Join-Path $env:CODEX_FLOW_BIN_DIR 'codex-flow.cmd') strategy set quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:CODEX_FLOW_BIN_DIR 'codex-flow.cmd') strategy routing direct
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Keep the smoke test deterministic and independent of public GitHub API rate limits.
          $releaseFixture = Join-Path $tmp 'releases.json'
          $releaseFixtureJson = '[{"tag_name":"v1.7.0","draft":false,"prerelease":false,"assets":[]}]'
          [System.IO.File]::WriteAllText($releaseFixture, $releaseFixtureJson, $utf8NoBom)
          $env:CODEX_FLOW_UPDATE_RELEASES_API = $releaseFixture

          Remove-Item Env:CODEX_FLOW_BIN_DIR
          & (Join-Path $tmp 'bin-installed/codex-flow.cmd') update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:CODEX_FLOW_UPDATE_RELEASES_API -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $tmp 'bin-installed/codex-flow.cmd'))) { throw 'custom bin directory was not reused by update' }
          if (-not (Test-Path (Join-Path $tmp 'bin-installed/codex-flow.ps1'))) { throw 'PowerShell wrapper was not refreshed in custom bin directory' }
          $policy = [System.IO.File]::ReadAllText($policyPath, $utf8NoBom)
          if ($policy -notmatch 'profile\s*=\s*"quality"') { throw 'strategy profile was not preserved by update' }
          if ($policy -notmatch 'mode\s*=\s*"direct"') { throw 'routing mode was not preserved by update' }
          foreach ($expected in @(
            'review = "strict"', 'fanout = "conservative"', 'routine_effort = "xhigh"',
            'complex_effort = "max"', 'max_concurrent_threads = 3', 'max_repair_cycles = 1',
            'notifications = false', 'retention_days = 17'
          )) {
            if (-not $policy.Contains($expected)) { throw "policy value lost on update: $expected" }
          }
          $config = [System.IO.File]::ReadAllText((Join-Path $env:CODEX_HOME 'config.toml'), $utf8NoBom)
          if (-not $config.Contains('# non-ASCII sentinel: ' + $sentinel)) { throw 'non-ASCII config sentinel was not preserved after update' }

          & (Join-Path $tmp 'bin-installed/codex-flow.cmd') uninstall
          if (Test-Path (Join-Path $env:CODEX_HOME 'codex-flow.toml')) { throw 'policy survived uninstall' }
          if (Test-Path (Join-Path $env:CODEX_HOME 'skills/flow-pilot')) { throw 'FlowPilot skill survived uninstall' }
          if (Test-Path (Join-Path $env:CODEX_HOME 'codex-flow')) { throw 'state survived uninstall' }
          if (Test-Path (Join-Path $tmp 'bin-installed/codex-flow.cmd')) { throw 'custom cmd wrapper survived uninstall' }
          if (Test-Path (Join-Path $tmp 'bin-installed/codex-flow.ps1')) { throw 'custom PowerShell wrapper survived uninstall' }
          $config = [System.IO.File]::ReadAllText((Join-Path $env:CODEX_HOME 'config.toml'), $utf8NoBom)
          if (-not $config.Contains('# non-ASCII sentinel: ' + $sentinel)) { throw 'non-ASCII config sentinel was not preserved after uninstall' }
