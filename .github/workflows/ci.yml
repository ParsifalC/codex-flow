name: ci

on:
  push:
  pull_request:

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          bash -n install.sh
          bash -n bin/codex-flow
          bash -n scripts/doctor
          bash -n scripts/uninstall
          bash -n tests/smoke.sh
          bash -n tests/benchmark.sh
          bash -n tests/runner.sh
          bash -n tests/corpus.sh
          bash -n tests/report.sh
          python3 -m py_compile scripts/check-recommendation.py
          python3 -m py_compile scripts/analyze-benchmark.py
          python3 -m py_compile scripts/run-benchmark.py
          python3 -m py_compile scripts/materialize-corpus.py
          python3 -m py_compile scripts/render-benchmark-report.py
          python3 -m py_compile scripts/benchmark-local.py
      - name: Recommendation policy test
        run: |
          python3 scripts/check-recommendation.py \
            --fixture tests/fixtures/models.json \
            --json | tee /tmp/recommendation.json
          grep -Fq '"parent_recommended_model": "gpt-5.6-sol"' /tmp/recommendation.json
          grep -Fq '"worker_model": "gpt-5.6-luna"' /tmp/recommendation.json

          cp policy/defaults.toml /tmp/defaults.toml
          sed -i 's/worker_model = "gpt-5.6-luna"/worker_model = "gpt-5.6-terra"/' /tmp/defaults.toml
          python3 scripts/check-recommendation.py \
            --fixture tests/fixtures/models.json \
            --defaults /tmp/defaults.toml \
            --write --json >/tmp/recommendation-write.json
          grep -Fq 'worker_model = "gpt-5.6-luna"' /tmp/defaults.toml
          grep -Fq '"changed": true' /tmp/recommendation-write.json
      - name: Benchmark routing test
        run: bash tests/benchmark.sh
      - name: Benchmark runner test
        run: bash tests/runner.sh
      - name: Benchmark corpus test
        run: bash tests/corpus.sh
      - name: Benchmark report test
        run: bash tests/report.sh
      - name: Installer and CLI smoke test
        run: bash tests/smoke.sh

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell entrypoints
        shell: pwsh
        run: |
          $files = @(
            'install.ps1',
            'bin/codex-flow.ps1',
            'scripts/doctor.ps1',
            'scripts/uninstall.ps1'
          )
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }
      - name: Installer and CLI smoke test
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $tmp = Join-Path $env:RUNNER_TEMP 'codex-flow-smoke'
          $env:CODEX_HOME = Join-Path $tmp '.codex'
          $env:CODEX_FLOW_BIN_DIR = Join-Path $tmp 'bin-installed'
          $fakeBin = Join-Path $tmp 'bin'
          New-Item -ItemType Directory -Force -Path $env:CODEX_HOME,$env:CODEX_FLOW_BIN_DIR,$fakeBin | Out-Null
          '@echo off\r\necho codex-test 0.0.0\r\n' | Set-Content (Join-Path $fakeBin 'codex.cmd') -NoNewline
          $env:PATH = "$fakeBin;$env:CODEX_FLOW_BIN_DIR;$env:PATH"
          @'
model = "user-parent-model"
model_reasoning_effort = "high"

[unrelated]
keep_me = true
'@ | Set-Content (Join-Path $env:CODEX_HOME 'config.toml')

          & "$root\install.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:CODEX_FLOW_BIN_DIR 'codex-flow.cmd') status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:CODEX_FLOW_BIN_DIR 'codex-flow.cmd') doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $config = Get-Content (Join-Path $env:CODEX_HOME 'config.toml') -Raw
          if ($config -notmatch 'default_subagent_model\s*=\s*"gpt-5\.6-luna"') { throw 'worker model was not installed' }
          $policy = Get-Content (Join-Path $env:CODEX_HOME 'codex-flow.toml') -Raw
          if ($policy -notmatch 'model\s*=\s*"auto"') { throw 'auto worker policy was not preserved' }

          & (Join-Path $env:CODEX_FLOW_BIN_DIR 'codex-flow.cmd') uninstall
          if (Test-Path (Join-Path $env:CODEX_HOME 'codex-flow.toml')) { throw 'policy survived uninstall' }
