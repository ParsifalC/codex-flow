name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n scripts/doctor
          bash -n scripts/uninstall
          bash -n tests/smoke.sh
      - name: Installer smoke test
        run: bash tests/smoke.sh
