name: ota-review-fix

on:
  workflow_dispatch:
  push:
    branches: [feat/ota-update-system]
    paths:
      - '.github/review-fix.py'
      - '.github/workflows/review-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ota-update-system
          fetch-depth: 0
      - name: Adapt final review helper to current UpdateView indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/review-fix.py')
          text = path.read_text(encoding='utf-8')
          for variable in ('restart_button', 'codex_button'):
              start = text.index(f"{variable} = re.compile(r'''(?ms)")
              end = text.index("''')", start) + 4
              block = text[start:end]
              lines = block.splitlines()
              lines[0] = lines[0].replace('(?ms)', '(?ms)    ', 1)
              for index in range(1, len(lines) - 1):
                  lines[index] = '    ' + lines[index]
              text = text[:start] + '\n'.join(lines) + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply final OTA review fixes
        run: python3 .github/review-fix.py
      - name: Validate final OTA patch
        run: |
          python3 -m py_compile scripts/updater.py scripts/flowpilot.py scripts/doctor.py scripts/generate-release-manifest.py tests/test_updater.py tests/test_cli_update.py
          python3 -m unittest tests.test_updater tests.test_cli_update
      - name: Commit final OTA fixes and clean helper
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/review-fix.py .github/workflows/review-fix.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(update): apply final OTA self-review fixes'
          git pull --rebase origin feat/ota-update-system
          git push origin HEAD:feat/ota-update-system
