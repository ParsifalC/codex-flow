name: ota-hardening

on:
  push:
    branches: [feat/ota-update-system]
    paths:
      - '.github/workflows/ota-hardening.yml'
      - '.github/ota-hardening.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ota-update-system
          fetch-depth: 0
      - name: Apply OTA hardening
        run: python3 .github/ota-hardening.py
      - name: Validate focused updater tests
        run: |
          python3 -m py_compile scripts/updater.py scripts/doctor.py tests/test_updater.py
          python3 tests/test_updater.py
      - name: Commit hardened implementation
        run: |
          rm -f .github/ota-hardening.py .github/workflows/ota-hardening.yml
          git config user.name 'codex-flow automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(update): harden OTA transactions and notifications'
          git push origin HEAD:feat/ota-update-system
